discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: www.poolparty.io
  note: >-
    Served from www.poolparty.io, which is the only origin PoolParty runs: the apex poolparty.io answers 308
    to www for every path, and www hosts the website, the MCP endpoint (/api/mcp), the A2A JSON-RPC endpoint
    (/api/a2a) and the public JSON manifests. The legacy /.well-known/agent.json is ALSO served and is
    byte-identical (7,126 bytes) to the canonical card. The www host is a Vercel SPA that answers 200 with a
    15,925-byte HTML shell for any extensionless or .txt path, including a negative-control path that cannot
    exist, so a 200 alone proves nothing here; the card is accepted because it came back as
    application/json, parsed as a JSON object with the full AgentCard shape, and the provider's own
    robots.txt, sitemap.xml, llms.txt, AGENTS.md and MCP server card all name exactly this URL. Ownership is
    not in question: provider.organization is "PoolParty" with provider.url https://www.poolparty.io/, the
    card's url is on the same host, and the a2aregistry.org record (id 91510c8e-f06e-41c6-a09d-ef0ac64e6b34)
    names the same canonical card URL and endpoint.
