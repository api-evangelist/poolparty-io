summary: 'PoolParty operates ONE remote MCP server at https://www.poolparty.io/api/mcp — the same Vercel origin
  as its website, A2A endpoint and public JSON manifests. It is Streamable HTTP, POST-only (a GET returns 405 with
  a JSON body that itself documents the expected headers, the bearer handoff and a quickstart), speaks MCP protocol
  version 2025-06-18, identifies itself as serverInfo {name: poolparty, version: 0.20.21}, and answers initialize,
  tools/list, resources/list, resources/templates/list and prompts/list ANONYMOUSLY. tools/list returned 71 tools,
  every one with a JSON Schema draft-07 inputSchema and an execution.taskSupport of "forbidden" (the provider advertises
  70: 66 default plus 4 feature-flagged paid-action tools). By the tools'' own descriptions 36 require no MCP auth,
  34 require a scoped pilot key (Authorization: Bearer ppk_...), and 1 do not say. Six static resources, eight resource
  templates and four prompts are also published. The server is listed in the official MCP registry as io.poolparty/main-stage-airtime
  (active, published 2026-05-30, registry copy at version 0.20.8 behind the live 0.20.21) and on Glama. Anonymous
  tools/list succeeded, so authorship is knowable: the tool names are PoolParty-specific (resolve_channel, get_airtime_opportunity,
  pool_block, prepare_superblock_purchase, publish_program_queue) and match no shared platform fingerprint — this
  is a provider-built server.'
deployment:
  mode: remote
  endpoint: https://www.poolparty.io/api/mcp
  auth: none
  verified: probed
  protected_tools_auth: 'api-key — Authorization: Bearer <pilot_key> (keys are prefixed ppk_ per the 405 body and
    the agent card); obtained through the request_pilot_key tool (self-attestation questionnaire; discovery_submission
    track can auto-provision a short-lived submit:block key, everything else is admin-reviewed)'
  required_headers:
    Content-Type: application/json
    Accept: application/json, text/event-stream
  note: 'A hosted HTTPS endpoint an MCP client POSTs to directly; PoolParty ships no stdio package and documents
    no npx/uvx install (npm and PyPI searched 2026-09-19 — nothing first-party). auth is "none" in the connection
    sense: initialize and every list method need no credential and 36-37 tools are callable anonymously. No OAuth
    metadata is served on this host (/.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource
    return the SPA shell). Wallet-side actions (mint, pool, withdraw, paid-action settlement) additionally require
    the wallet owner to sign a prepared transaction — the server prepares intents, it never signs or broadcasts.'
