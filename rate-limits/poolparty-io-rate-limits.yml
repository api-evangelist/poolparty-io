summary: >-
  PoolParty publishes two concrete limits, both inside MCP tool descriptions, and otherwise states that
  protected tools are "rate-limited per key" with a per-key "rate-limit tier" readable through get_key_info.
  No rate-limit response headers are documented anywhere, no exhaustion status code is published, and the
  REST manifest routes carry only cache TTLs. The provider's pilot guidance is advisory throttling by
  design: "Submit one high-quality block. Do not farm rewards." with enforcement described as
  "advisory_and_rate_limited".
rate_limits:
- name: Channel creation per key
  scope: per-key
  limit: 3
  window: 1 hour
  metric: create_channel_from_template calls
  applies_to: [create_channel_from_template]
  source: 'mcp/poolparty-io-mcp-tools.json#create_channel_from_template — "Rate-limited: 3 per hour per key."'
