  scope: per-session
  limit: 3
  window: session lifetime
  metric: submissions
  applies_to: [create_join_session, submit_media_block]
  source: 'mcp/poolparty-io-mcp-tools.json#create_join_session — "Session allows up to 3 anonymous submissions."'
