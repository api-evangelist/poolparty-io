apis:
- aid: poolparty-io:poolparty-mcp-server
  name: PoolParty Main Stage Airtime MCP Server
  description: >-
    Remote Model Context Protocol server (official registry name io.poolparty/main-stage-airtime) at
    https://www.poolparty.io/api/mcp — Streamable HTTP, POST only, protocol version 2025-06-18, serverInfo
    poolparty 0.20.21. initialize, tools/list, resources/list, resources/templates/list and prompts/list answer
    anonymously: 71 tools (resolve_channel, get_channel_stream, get_airtime_opportunity, submit_media_block,
    pool_block, prepare_superblock_purchase, publish_program_queue …) each with a draft-07 inputSchema, six
    resources under poolparty://, eight resource templates and four prompts. 36 tools need no credential; 34
    need a scoped pilot key (Authorization: Bearer ppk_…) issued by the request_pilot_key tool; wallet-side
    actions additionally require the wallet owner to sign a prepared Polygon Amoy / Base transaction.
  humanURL: https://www.poolparty.io/agent
  baseURL: https://www.poolparty.io/api/mcp
  tags:
  - MCP
  - agent-native
  - Airtime
  properties:
  - type: MCPServer
    url: mcp/poolparty-io-mcp.yml
  - type: MCPServer
    name: PoolParty MCP endpoint (Streamable HTTP)
    url: https://www.poolparty.io/api/mcp
  - type: Documentation
    url: https://www.poolparty.io/agent
  - type: GettingStarted
    url: https://www.poolparty.io/agent-quickstart
  - type: AgenticAccess
    url: agentic-access/poolparty-io-agentic-access.yml
- aid: poolparty-io:poolparty-agent-concierge-a2a
  name: PoolParty Agent Concierge (A2A)
  description: >-
    Agent2Agent surface: an A2A 0.3.0 agent card served at https://www.poolparty.io/.well-known/agent-card.json
    (and byte-identically at the legacy /.well-known/agent.json), JSONRPC transport, version 0.1.0, four
    read-only skills — route_project_to_airtime, explain_poolparty_submission_path, evaluate_media_block_fit,
    explain_poolparty_economics — answered by a JSON-RPC 2.0 endpoint at https://www.poolparty.io/api/a2a that
    implements message/send and the legacy tasks/send (not tasks/get) and, on GET, self-describes and embeds the
    card. The provider calls it a "thin, read-only A2A Agent Concierge bridge" over its MCP-native surface;
    streaming and push notifications are declared unsupported. Listed on a2aregistry.org as
    91510c8e-f06e-41c6-a09d-ef0ac64e6b34.
  humanURL: https://www.poolparty.io/agent
  baseURL: https://www.poolparty.io/api/a2a
  tags:
  - A2A
  - agent-native
  properties:
  - type: AgentCard
    url: a2a/poolparty-io-a2a.yml
  - type: AgentCard
    name: A2A Agent Card (provider-hosted)
    url: https://www.poolparty.io/.well-known/agent-card.json
  - type: Documentation
    url: https://www.poolparty.io/agent
- aid: poolparty-io:poolparty-public-manifest-api
  name: PoolParty Public Manifest API
  description: >-
    Unauthenticated, read-only JSON routes under https://www.poolparty.io/api that the provider names as the
    "source of truth" for agents: the agent manifest (/agent/manifest, schema poolparty.agent.manifest.v1, with a
    static snapshot at /.well-known/poolparty-agent.json), the Agent Concierge (/agent/concierge), the channel list
    (/channels) and per-channel manifest, airtime, metrics and collateral-opportunity documents, the activity
    snapshot (/channels/{slug}/activity) and its server-sent-events twin (/activity/stream). Write routes
    (faucets, mint/pool intents, paid-action quote/settle, agent-notification subscriptions) are POST-only and
    documented only through the MCP tools that wrap them. No OpenAPI, AsyncAPI or other machine-readable
    contract is published for these routes; each document carries its own schema id and cache TTL.
  humanURL: https://www.poolparty.io/agent
  baseURL: https://www.poolparty.io/api
