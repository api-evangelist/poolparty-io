summary: >-
  PoolParty's conformance profile is the agent-protocol stack, verified live: an A2A 0.3.0 agent card at the
  RFC 8615 canonical path (graded conformant) with a working JSON-RPC 2.0 responder, an MCP server negotiating
  protocol 2025-06-18 that answers every list method anonymously, a registry server.json on the 2025-12-11
  schema, llms.txt and AGENTS.md discovery files, and a server-sent-events activity stream. Its payment layer
  is declared "x402-compatible" with CAIP-2 chain ids (eip155:80002 Polygon Amoy, eip155:8453 Base) and
  XMTP lifecycle messaging, none of which this pass exercised. It declares no OAuth/OIDC, no RFC 9457 problem
  details, no RFC 9116 security.txt, no RFC 9727 API catalog, no APIs.json and no RFC 8594 sunset signalling,
  and publishes no OpenAPI. No domain standard for the broadcast/advertising market (OpenRTB, VAST, SCTE)
  is declared or detected, and none is asserted here.
