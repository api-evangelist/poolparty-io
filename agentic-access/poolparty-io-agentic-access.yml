description: Recommended x-agentic-access execution contracts for PoolParty's 71 MCP tools (there is no OpenAPI,
  so the unit is the tool, not the operation). The classification is heuristic — read-only prefixes and the provider's
  own 'Read-only' / 'No auth required' / 'Requires ... scope' / wallet-approval sentences in each tool description,
  plus the agent manifest's delegated_agent_policy (which lists the transactions that need a signer) and prohibited_agent_actions
  (execute_payment_without_human_approval, spam_submissions, farm_rewards_via_repeated_submissions, attempt_admin_routes,
  bypass_policy_limits). PoolParty does NOT publish x-agentic-access itself; this is a governance starting point
  derived from what it does publish, and audience is left null to bind per deployment. Vocabulary and TTL ceilings
  mirror research/curity/agentic-governance/.
provider_published_access_guidance:
  access_model_verbatim: 36 tools and all 14 resources require no auth or read-only resource access unless the resource
    itself needs channel backing data / 30 base tools require scoped API keys; current deployment exposes 34 protected
    tools when paid-action flags are included
  human_approval_verbatim: Agents must not initiate payments, collateral, paid airtime, or reward-claim transactions
    without explicit human wallet approval unless they are signing from their own funded wallet. PoolParty still
    verifies receipts before finality.
  prohibited_agent_actions:
  - execute_payment_without_human_approval
  - spam_submissions
  - farm_rewards_via_repeated_submissions
  - attempt_admin_routes
  - bypass_policy_limits
  delegated_agent_policy:
    status: prepare_only
    enabled: false
    mode: prepare_only_agent_owned_wallet
    currentSafeModels:
      agentOwnedWalletDirectSigning: true
      humanDelegatedBudget: false
      operatorOrchestratorSponsoredExecution: false
  execution_annotation: every tool declares execution.taskSupport "forbidden" (no long-running MCP tasks)
