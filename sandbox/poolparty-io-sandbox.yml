  steps: [resolve_channel("PP0"), get_collateral_opportunity, claim_test_collateral, claim_test_pol (when gas is low), pool_block, 'submit the returned wallet transaction', finalize_pool_support, get_wallet_pooling_state, withdraw_pool_support (before lock), get_pooling_receipt, get_block_economics]
